<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Byte's Rush Hour Launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=IBM+Plex+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
/* Layout: one 16:9 stage (1280x720 logical) fitted to the window, HTML overlays on top. Single theme by design. */
:root {
  --frame: #1b1a26;
  --ink: #fff6e3;
  --muted: #b4aac2;
  --key: #2c2a3a;
  --accent: #f2a03d;
  --red: #d6532b;
  --card: #fff6e3;
  --card-ink: #1b1a26;
  --display: "Lilita One", "Arial Black", Impact, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--frame); color: var(--ink); font: 14px/1.5 var(--mono);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; overflow: hidden; user-select: none; -webkit-user-select: none;
}
.bar, .stage { width: min(100%, 1280px, calc((100vh - 110px) * 16 / 9)); }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.who { font: 16px var(--display); letter-spacing: 0.04em; color: var(--muted); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: 15px/1 var(--display); letter-spacing: 0.04em; color: var(--ink); background: var(--key); border: 0; border-radius: 10px; border-bottom: 4px solid #000; padding: 9px 13px 8px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { background: #3b3850; }
.btn:active { transform: translateY(2px); border-bottom-width: 2px; }
.btn.primary { background: var(--accent); color: #1b1a26; }
.btn.primary:hover { background: #ffbe63; }
.btn[aria-pressed="true"] { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.stage { position: relative; aspect-ratio: 16 / 9; }
canvas { width: 100%; height: 100%; display: block; border-radius: 14px; touch-action: none; cursor: grab; }
canvas.aiming { cursor: grabbing; }
.help { margin: 0; color: var(--muted); font-size: 12px; text-align: center; }
.help b { color: var(--ink); font-weight: 600; }

.ov { position: absolute; inset: 0; display: grid; place-items: center; padding: 3%; }
.ov[hidden] { display: none; }
.card {
  width: min(92%, 600px); max-height: 92%; overflow: auto; background: var(--card); color: var(--card-ink);
  border: 4px solid #1b1a26; border-radius: 18px; box-shadow: 0 10px 0 #1b1a26; padding: clamp(16px, 2.6vw, 26px);
  animation: boing 0.45s cubic-bezier(0.3, 1.6, 0.5, 1); user-select: text; -webkit-user-select: text;
}
.card:focus { outline: none; }
@keyframes boing { from { transform: scale(0.4) rotate(-4deg); opacity: 0; } }
.card h2 { margin: 0 0 10px; font: clamp(22px, 3vw, 32px)/1.1 var(--display); color: var(--red); letter-spacing: 0.02em; }
.card p { margin: 0 0 10px; font-size: clamp(14px, 1.5vw, 16px); }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.card .btn { color: var(--ink); }
.card .btn.primary { color: #1b1a26; }
.tbc { color: #b0581c; border: 1.5px dashed #b0581c; border-radius: 4px; padding: 0 5px; font-size: 0.88em; }
.stars { font: 44px/1 var(--display); color: #e7a83a; letter-spacing: 6px; text-shadow: 0 4px 0 #1b1a26; margin-bottom: 6px; }
.stars .off { color: #d9cdb4; }
.mail { font: 600 clamp(16px, 2vw, 20px) var(--mono); overflow-wrap: anywhere; }
.quick h3 { font: 18px var(--display); color: var(--red); margin: 16px 0 6px; letter-spacing: 0.02em; }

.title { background: rgb(27 26 38 / 0.35); text-align: center; }
.title-inner { display: grid; gap: 12px; justify-items: center; }
.title h1 { margin: 0; font: clamp(34px, 6.5vw, 80px)/0.95 var(--display); color: var(--ink); text-shadow: 0 6px 0 #1b1a26, 0 0 1px #1b1a26; letter-spacing: 0.02em; transform: rotate(-3deg); }
.title h1 span { color: var(--accent); display: block; }
.title p { margin: 0; font: clamp(14px, 1.6vw, 18px)/1.4 var(--display); letter-spacing: 0.04em; text-shadow: 0 3px 0 #1b1a26; }
.title .go { font-size: clamp(18px, 2.2vw, 26px); padding: 14px 24px 12px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }

.toasts { position: absolute; left: 1.6%; bottom: 3%; display: grid; gap: 6px; pointer-events: none; }
.toast { background: var(--card); color: var(--card-ink); border: 3px solid #1b1a26; border-radius: 10px; padding: 6px 10px; font: 15px var(--display); letter-spacing: 0.03em; box-shadow: 0 4px 0 #1b1a26; animation: boing 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); }
.toast small { display: block; font: 11px var(--mono); color: #5a5266; }
.portrait { display: none; }
@media (orientation: portrait) and (pointer: coarse) { .portrait { display: block; } }
@media (prefers-reduced-motion: reduce) { .card, .toast, .title .go { animation: none; } }
</style>

<div class="bar">
  <span class="who">SHUVANG ARJYAL · IT SUPPORT · DARWIN</span>
  <div class="btns">
    <button class="btn" type="button" id="reset-btn">RESET TOWER</button>
    <button class="btn" type="button" id="quick-btn">QUICK VIEW</button>
    <button class="btn" type="button" id="snd" aria-pressed="false">SOUND OFF</button>
  </div>
</div>
<div class="stage" id="stage">
  <canvas id="c" tabindex="0" aria-label="Slingshot game. Drag Byte back and let go to launch at the tower. Keyboard: arrows aim, Space launches. Click any piece to read it."></canvas>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="ov title" id="title">
    <div class="title-inner">
      <h1>BYTE'S <span>RUSH HOUR</span></h1>
      <p>Knock down the tower to read Shuvang Arjyal's story.<br>IT support · Darwin, NT · Available now</p>
      <button class="btn primary go" type="button" id="play-btn">PLAY</button>
      <button class="btn" type="button" id="title-quick">NO TIME? QUICK VIEW</button>
      <p class="portrait">Turn your phone sideways for the best view.</p>
    </div>
  </div>
  <div class="ov" id="ov" hidden><div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="card-t" tabindex="-1"><h2 id="card-t"></h2><div id="card-b"></div></div></div>
</div>
<p class="help"><b>Drag</b> Byte back and let go · keyboard: <b>← →</b> angle, <b>↑ ↓</b> power, <b>SPACE</b> launch · <b>click</b> any piece to read it</p>

<script>
(function () {
  "use strict";
  var M = window.Matter;
  function T(s) { return '<span class="tbc">' + s + "</span>"; }
  var EMAIL = "you@example.com";

  /* ---------- Content: one fact per tower piece ---------- */
  var FACTS = {
    since: { title: "SINCE 2022", body: "<p>Shift Manager at McDonald's and Shift Leader at Nando's since September 2022.</p><p>A lot of the job is the same as IT support: work out what's wrong, fix what I can, call in help for what I can't, and keep everyone in the loop.</p>" },
    crew: { title: "CREW", body: "<p>8 to 15 people on a busy shift I run.</p>" },
    training: { title: "TRAINING", body: "<p>I train new starters regularly. Someone who knows why something works needs help less often.</p>" },
    degree: { title: "DEGREE", body: "<p>Bachelor of Information Technology, Charles Darwin University, 2025.</p>" },
    py: { title: "PROFESSIONAL YEAR", body: "<p>ACS Professional Year (ICT) at NIT Darwin, completed 2026. Member of the Australian Computer Society.</p>" },
    courses: { title: "COURSES", body: "<p>Online courses (Skillsoft): ISC2 Certified in Cybersecurity, CompTIA Tech+, CISA IT management frameworks.</p><p>Also current First Aid / CPR and RSA.</p>" },
    dgk: { title: "DGK INTERNSHIP", body: "<p>An internship at DGK Business Consultancy, setting up tools that do repetitive office work automatically, so nobody copies information between programs by hand.</p>" },
    leads: { title: "WEBSITE LEADS", body: "<p>DGK wanted to know which businesses visited its website. I adapted a ready-made template into a process that notices each visit, works out which company it came from, and saves it as a possible customer.</p><p>The catch: most visits came from home and phone internet connections, not businesses, and every lookup cost money. " + T("To confirm: how you dealt with it, and rough numbers") + "</p>" },
    data: { title: "LOOKING AFTER DATA", body: "<p>Who visits a website can count as personal information, so I checked how it was handled. Visitors saw a tracking notice, and the passwords connecting the tools were stored securely.</p>" },
    checks: { title: "CHECKING WORK", body: "<p>I checked two teammates' work before it was marked done. Same as checking a closing shift, different setting.</p>" },
    now: { title: "BUILDING NOW", body: "<p>An AI assistant that works like a chief of staff, handing jobs to smaller helpers like a Task Manager and a Lead Finder. Most of them work now.</p><p>" + T("To confirm: what it does day to day, and which helpers work") + "</p>" },
    boss: { title: "RUSH HOUR CLEARED", body: "<p>The frozen till is down. On a real night, the tills stopped working at McDonald's in the middle of a busy service.</p><p>" + T("To confirm: what you tried first, who you called, how long it took, what changed after") + "</p>" }
  };
  var SHORT = { since: "2022", crew: "CREW", training: "TRAIN", degree: "DEGREE", py: "PRO YR", courses: "CERTS", dgk: "DGK", leads: "WEBSITE LEADS", data: "DATA", checks: "CHECKS", now: "BUILDING NOW", boss: "" };
  var ORDER = ["since", "crew", "training", "degree", "py", "courses", "dgk", "leads", "data", "checks", "now", "boss"];

  /* ---------- Canvas ---------- */
  var VW = 1280, VH = 720, GROUND = 640;
  var cv = document.getElementById("c"), ctx = cv.getContext("2d"), scale = 1;
  function fit() {
    var r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    scale = cv.width / VW;
  }
  fit(); window.addEventListener("resize", fit);
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var C = {
    ink: "#1b1a26", sky1: "#f8cf8a", sky2: "#f3ae67", sky3: "#e88b55",
    hill: "#c4715b", hill2: "#9c5452", dirt: "#b65d33", grass: "#7c9c3c", grassL: "#a6c055",
    wood: "#c98d4b", woodL: "#e2ad6a", woodD: "#8e5b2a",
    till: "#9aa1ae", tillL: "#c4cad4", screen: "#3d6aa8", ticket: "#fff6e3", tray: "#d6532b",
    body: "#c9893b", bodyD: "#94602a", belly: "#ecc684", frill: "#d6532b", frillI: "#f2a03d", white: "#fffbe8", coin: "#ffd23f"
  };

  /* ---------- Physics world ---------- */
  var engine = M.Engine.create({ enableSleeping: true });
  engine.gravity.y = 1;
  var world = engine.world;
  var ANCHOR = { x: 230, y: 470 }, BYTE_R = 22, MAXPULL = 140, POWER = 0.135;
  var pieces = [], byte = null, state = "title", aim = null, launches = 0, revealed = 0, cleared = false;
  var particles = [], floaters = [], clouds = [], flightT = 0, restT = 0, dizzyT = 0, bandSnap = 0;
  for (var i = 0; i < 6; i++) clouds.push({ x: Math.random() * VW, y: 50 + Math.random() * 160, s: 0.5 + Math.random() });

  M.World.add(world, [
    M.Bodies.rectangle(VW / 2, GROUND + 60, VW * 3, 120, { isStatic: true, friction: 0.9, label: "ground" }),
    M.Bodies.rectangle(VW + 400, 300, 40, 1200, { isStatic: true, label: "wall" })
  ]);

  // kind: till | tickets | tray | boss
  var LAYOUT = [
    ["tickets", 900, 600, 56, 80, "since"], ["till", 1000, 600, 70, 80, "crew"], ["tickets", 1100, 600, 56, 80, "training"],
    ["tray", 1000, 552, 270, 16, "degree"],
    ["till", 925, 504, 56, 80, "py"], ["tickets", 1000, 514, 40, 60, "courses"], ["till", 1075, 504, 56, 80, "dgk"],
    ["tray", 1000, 456, 210, 16, "leads"],
    ["tickets", 960, 416, 48, 64, "data"], ["tickets", 1040, 416, 48, 64, "checks"],
    ["tray", 1000, 377, 150, 14, "now"],
    ["boss", 1000, 335, 74, 70, "boss"]
  ];
  function buildTower() {
    pieces.forEach(function (p) { M.World.remove(world, p.body); });
    pieces = [];
    LAYOUT.forEach(function (L) {
      var b = M.Bodies.rectangle(L[1], L[2], L[3], L[4], { density: L[0] === "tray" ? 0.0015 : 0.002, friction: 0.7, restitution: 0.08, label: "piece", sleepThreshold: 30 });
      M.Body.setStatic(b, false);
      pieces.push({ body: b, kind: L[0], w: L[3], h: L[4], key: L[5], x0: L[1], y0: L[2], out: false, wob: 0 });
      M.World.add(world, b);
    });
    revealed = 0; launches = 0; cleared = false;
  }
  function newByte() {
    if (byte) M.World.remove(world, byte);
    byte = M.Bodies.circle(ANCHOR.x, ANCHOR.y, BYTE_R, { density: 0.006, restitution: 0.35, friction: 0.5, frictionAir: 0, label: "byte" });
    M.Body.setStatic(byte, true);
    M.World.add(world, byte);
    aim = { x: ANCHOR.x, y: ANCHOR.y, kbAngle: -0.62, kbPower: 0.8 };
    state = "ready"; flightT = 0; restT = 0; dizzyT = 0;
  }
  buildTower(); newByte(); state = "title";

  /* ---------- Sound (off by default) ---------- */
  var soundOn = false, actx = null;
  function beep(f1, f2, d, type, vol) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain(), n = actx.currentTime;
      o.type = type || "triangle"; o.frequency.setValueAtTime(f1, n);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, n + d);
      g.gain.setValueAtTime(vol || 0.06, n); g.gain.exponentialRampToValueAtTime(0.0001, n + d);
      o.connect(g); g.connect(actx.destination); o.start(n); o.stop(n + d);
    } catch (e) {}
  }
  var snd = document.getElementById("snd");
  snd.addEventListener("click", function () { soundOn = !soundOn; snd.setAttribute("aria-pressed", soundOn); snd.textContent = soundOn ? "SOUND ON" : "SOUND OFF"; beep(660, 990, 0.1); });

  /* ---------- Overlays ---------- */
  var ov = document.getElementById("ov"), card = document.getElementById("card"), cardT = document.getElementById("card-t"), cardB = document.getElementById("card-b");
  var prevState = null;
  function openCard(title, html, cls) {
    cardT.textContent = title; cardB.innerHTML = html; card.className = "card" + (cls ? " " + cls : "");
    ov.hidden = false; card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
    card.scrollTop = 0;
    var f = cardB.querySelector("[data-close], .btn.primary"); (f || card).focus({ preventScroll: true });
    beep(520, 780, 0.08);
  }
  function closeCard() { if (ov.hidden) return; ov.hidden = true; cv.focus({ preventScroll: true }); }
  ov.addEventListener("click", function (e) { if (e.target === ov) closeCard(); });
  function factCard(key) { var f = FACTS[key]; openCard(f.title, f.body + '<div class="row"><button class="btn primary" type="button" data-close>KEEP PLAYING</button></div>'); }
  function quickHTML() {
    return "<p>Shuvang Arjyal · IT support · Darwin, NT · Full work rights · Available now</p><p>I spent four years running fast-food shifts, where things break at the busiest moment and someone has to sort it out. I'm now an IT graduate looking for a support role.</p>" +
      '<p class="mail" id="mail-addr">' + EMAIL + "</p><p>" + T("To confirm: email") + "</p>" +
      '<div class="row"><button class="btn primary" type="button" data-copy>COPY EMAIL</button><a class="btn" href="mailto:' + EMAIL + '">OPEN MAIL</a></div>' +
      "<p style=\"margin-top:10px\">LinkedIn " + T("link") + " · CV " + T("file") + "</p>" +
      ORDER.map(function (k) { return "<h3>" + FACTS[k].title + "</h3>" + FACTS[k].body; }).join("") +
      '<div class="row"><button class="btn primary" type="button" data-close>CLOSE</button></div>';
  }
  function openQuick() { openCard("QUICK VIEW", quickHTML(), "quick"); }
  document.getElementById("quick-btn").addEventListener("click", openQuick);
  document.getElementById("title-quick").addEventListener("click", openQuick);
  document.addEventListener("click", function (e) {
    if (e.target.closest("[data-close]")) { closeCard(); return; }
    if (e.target.closest("[data-again]")) { closeCard(); buildTower(); newByte(); return; }
    var b = e.target.closest("[data-copy]"); if (!b) return;
    function done() { b.textContent = "COPIED!"; setTimeout(function () { b.textContent = "COPY EMAIL"; }, 1500); }
    function sel() { var a = document.getElementById("mail-addr"); if (!a) return; var r = document.createRange(); r.selectNodeContents(a); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    try { navigator.clipboard.writeText(EMAIL).then(done, sel); } catch (err) { sel(); }
  });
  document.getElementById("play-btn").addEventListener("click", function () {
    document.getElementById("title").hidden = true; state = "ready"; cv.focus({ preventScroll: true }); beep(523, 1046, 0.2);
    floater(ANCHOR.x, ANCHOR.y - 70, "PULL ME BACK!", "#fff6e3");
  });
  document.getElementById("reset-btn").addEventListener("click", function () { if (state === "title") return; buildTower(); newByte(); beep(300, 600, 0.15); });

  var toasts = document.getElementById("toasts");
  function toast(title, sub) {
    var t = document.createElement("div"); t.className = "toast"; t.innerHTML = title + "<small>" + sub + "</small>";
    toasts.appendChild(t); while (toasts.children.length > 3) toasts.firstChild.remove();
    setTimeout(function () { t.remove(); }, 3200);
  }

  /* ---------- Input ---------- */
  function toWorld(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH }; }
  var dragging = false;
  cv.addEventListener("pointerdown", function (e) {
    if (!ov.hidden || state === "title") return;
    var p = toWorld(e);
    if (state === "ready" && Math.hypot(p.x - ANCHOR.x, p.y - ANCHOR.y) < 90) {
      dragging = true; cv.setPointerCapture(e.pointerId); cv.classList.add("aiming"); moveAim(p); beep(200, 260, 0.05); return;
    }
    // click a piece to read it
    var hit = M.Query.point(pieces.map(function (q) { return q.body; }), p)[0];
    if (hit) { var pc = pieces.filter(function (q) { return q.body === hit; })[0]; reveal(pc, true); factCard(pc.key); }
  });
  cv.addEventListener("pointermove", function (e) { if (dragging) moveAim(toWorld(e)); });
  function endDrag() { if (!dragging) return; dragging = false; cv.classList.remove("aiming"); launch(); }
  cv.addEventListener("pointerup", endDrag);
  cv.addEventListener("pointercancel", function () { dragging = false; cv.classList.remove("aiming"); aim.x = ANCHOR.x; aim.y = ANCHOR.y; M.Body.setPosition(byte, ANCHOR); });
  function moveAim(p) {
    var dx = p.x - ANCHOR.x, dy = p.y - ANCHOR.y, d = Math.hypot(dx, dy);
    if (d > MAXPULL) { dx = dx / d * MAXPULL; dy = dy / d * MAXPULL; }
    if (dx > 20) dx = 20; // can't pull forwards
    aim.x = ANCHOR.x + dx; aim.y = ANCHOR.y + dy;
    M.Body.setPosition(byte, { x: aim.x, y: aim.y });
  }
  function kbAim() {
    var d = aim.kbPower * MAXPULL;
    moveAim({ x: ANCHOR.x - Math.cos(aim.kbAngle) * d, y: ANCHOR.y - Math.sin(aim.kbAngle) * d });
  }
  window.addEventListener("keydown", function (e) {
    if (!ov.hidden) { if (e.key === "Escape") closeCard(); return; }
    if (state === "title") { if (e.key === "Enter" && !e.target.closest("button")) document.getElementById("play-btn").click(); return; }
    if (state !== "ready") return;
    var used = true;
    if (e.key === "ArrowLeft") aim.kbAngle = Math.max(-1.4, aim.kbAngle - 0.05);
    else if (e.key === "ArrowRight") aim.kbAngle = Math.min(0.5, aim.kbAngle + 0.05);
    else if (e.key === "ArrowUp") aim.kbPower = Math.min(1, aim.kbPower + 0.05);
    else if (e.key === "ArrowDown") aim.kbPower = Math.max(0.2, aim.kbPower - 0.05);
    else if (e.key === " " || e.key === "Enter") { if (e.target.closest && e.target.closest("button")) return; e.preventDefault(); kbAim(); launch(); return; }
    else used = false;
    if (used) { e.preventDefault(); kbAim(); }
  });

  function launch() {
    var vx = (ANCHOR.x - aim.x) * POWER, vy = (ANCHOR.y - aim.y) * POWER;
    if (Math.hypot(vx, vy) < 2) { M.Body.setPosition(byte, ANCHOR); aim.x = ANCHOR.x; aim.y = ANCHOR.y; return; }
    M.Body.setStatic(byte, false);
    M.Body.setPosition(byte, { x: aim.x, y: aim.y });
    M.Body.setVelocity(byte, { x: vx, y: vy });
    M.Body.setAngularVelocity(byte, 0.12);
    state = "flying"; launches++; flightT = 0; restT = 0; bandSnap = 1;
    pieces.forEach(function (p) { M.Sleeping.set(p.body, false); });
    beep(180, 720, 0.25, "sawtooth", 0.05);
    for (var i = 0; i < 6; i++) particles.push({ x: aim.x, y: aim.y, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3, t: 0, life: 0.5, c: "#f1d9b0", r: 4 });
  }

  /* ---------- Collisions ---------- */
  M.Events.on(engine, "collisionStart", function (ev) {
    ev.pairs.forEach(function (pr) {
      var a = pr.bodyA, b = pr.bodyB;
      var rel = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
      if (rel < 3) return;
      var cx = pr.collision.supports[0] ? pr.collision.supports[0].x : (a.position.x + b.position.x) / 2;
      var cy = pr.collision.supports[0] ? pr.collision.supports[0].y : (a.position.y + b.position.y) / 2;
      var n = Math.min(10, Math.round(rel));
      for (var i = 0; i < n; i++) particles.push({ x: cx, y: cy, vx: (Math.random() - 0.5) * rel * 0.6, vy: -Math.random() * rel * 0.5, t: 0, life: 0.6, c: i % 2 ? "#f1d9b0" : "#e2ad6a", r: 3 + Math.random() * 3 });
      if (a === byte || b === byte) { squash = 1; if (rel > 6) { dizzyT = 2.2; beep(140, 70, 0.15, "square", 0.05); } }
      else beep(120 + Math.random() * 80, 60, 0.08, "square", 0.03);
      if (rel > 8 && !reduce) shake = Math.min(1, shake + rel / 30);
    });
  });

  /* ---------- Reveal + scoring ---------- */
  function reveal(p, quiet) {
    if (p.out) return;
    p.out = true; revealed++;
    var pos = p.body.position;
    for (var i = 0; i < 14; i++) particles.push({ x: pos.x, y: pos.y, vx: (Math.random() - 0.5) * 8, vy: -Math.random() * 8, t: 0, life: 0.8, c: i % 2 ? C.coin : C.white, r: 3 });
    floater(pos.x, pos.y - 30, "+ " + FACTS[p.key].title, "#fff6e3");
    if (!quiet) toast(FACTS[p.key].title, "Click the piece to read it");
    beep(988, 1319, 0.15);
    if (p.kind === "boss") { floater(pos.x, pos.y - 70, "RUSH HOUR CLEARED!", C.coin); beep(523, 1568, 0.4); }
    if (revealed === pieces.length && !cleared) { cleared = true; setTimeout(levelClear, reduce ? 300 : 1400); }
  }
  function stars() { return launches <= 3 ? 3 : launches <= 6 ? 2 : 1; }
  function levelClear() {
    for (var k = 0; k < 5; k++) (function (k) { setTimeout(function () { burst(500 + k * 150, 160 + (k % 2) * 60); }, k * 260); })(k);
    var s = stars();
    setTimeout(function () {
      openCard("TOWER DOWN!", '<div class="stars">' + "★★★".split("").map(function (c, i) { return i < s ? c : '<span class="off">★</span>'; }).join("") + "</div>" +
        "<p>" + launches + " launch" + (launches === 1 ? "" : "es") + ". Thanks for playing. If you're hiring for IT support in Darwin, I'd like to hear from you.</p>" +
        '<p class="mail" id="mail-addr">' + EMAIL + "</p><p>" + T("To confirm: email") + "</p>" +
        '<div class="row"><button class="btn primary" type="button" data-copy>COPY EMAIL</button><a class="btn" href="mailto:' + EMAIL + '">OPEN MAIL</a><button class="btn" type="button" data-again>PLAY AGAIN</button></div>' +
        "<p style=\"margin-top:10px\">LinkedIn " + T("link") + " · CV " + T("file") + "</p>");
    }, reduce ? 100 : 1500);
  }
  function burst(x, y) {
    var cols = [C.coin, C.frillI, C.white, "#7fd3ff", C.grassL, C.frill];
    for (var i = 0; i < 40; i++) { var a = Math.random() * 6.283, sp = 3 + Math.random() * 6; particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, life: 1.3, c: cols[i % cols.length], r: 3, g: 0.12 }); }
    beep(300 + Math.random() * 300, 900, 0.3);
  }
  function floater(x, y, s, c) { floaters.push({ x: x, y: y, s: s, c: c, t: 0 }); }

  /* ---------- Loop ---------- */
  var t = 0, last = 0, shake = 0, squash = 0, acc = 0, STEP = 1 / 60;
  function step(dt) {
    t += dt;
    if (state !== "title") M.Engine.update(engine, 1000 / 60);
    // pieces: detect fallen
    pieces.forEach(function (p) {
      var b = p.body, moved = Math.hypot(b.position.x - p.x0, b.position.y - p.y0);
      p.wob = Math.abs(b.angularVelocity) > 0.01 ? Math.min(1, p.wob + dt * 4) : Math.max(0, p.wob - dt * 2);
      if (!p.out && launches > 0 && (moved > 34 || Math.abs(b.angle) > 0.55)) reveal(p);
      if (b.position.y > VH + 200 || b.position.x > VW + 300) { M.Body.setStatic(b, true); }
    });
    if (state === "flying") {
      flightT += dt;
      var sp = Math.hypot(byte.velocity.x, byte.velocity.y);
      restT = sp < 0.6 ? restT + dt : 0;
      if (restT > 0.9 || flightT > 7 || byte.position.x > VW + 60 || byte.position.x < -60) { state = "respawn"; setTimeout(function () { if (state === "respawn") newByte(); }, 500); }
    }
    if (dizzyT > 0) dizzyT -= dt;
    if (bandSnap > 0) bandSnap = Math.max(0, bandSnap - dt * 3);
    if (squash > 0) squash = Math.max(0, squash - dt * 5);
    if (shake > 0) shake = Math.max(0, shake - dt * 3);
    for (var i = particles.length - 1; i >= 0; i--) { var q = particles[i]; q.t += dt; q.x += q.vx; q.y += q.vy; q.vy += q.g || 0.25; if (q.t > q.life) particles.splice(i, 1); }
    for (var f = floaters.length - 1; f >= 0; f--) { floaters[f].t += dt; if (floaters[f].t > 1.6) floaters.splice(f, 1); }
    clouds.forEach(function (c) { c.x += c.s * 12 * dt; if (c.x > VW + 120) c.x = -120; });
  }

  /* ---------- Drawing ---------- */
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function fillStroke(fill, lw) { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw || 4; ctx.strokeStyle = C.ink; ctx.stroke(); }

  function drawBG() {
    ctx.fillStyle = C.sky1; ctx.fillRect(0, 0, VW, 260);
    ctx.fillStyle = C.sky2; ctx.fillRect(0, 260, VW, 160);
    ctx.fillStyle = C.sky3; ctx.fillRect(0, 420, VW, 300);
    ctx.fillStyle = "#fff1c4"; ctx.beginPath(); ctx.arc(1080, 150, 56, 0, 6.283); ctx.fill();
    clouds.forEach(function (c) { ctx.fillStyle = "#fff4dc"; rr(c.x, c.y, 120, 30, 15); ctx.fill(); rr(c.x + 26, c.y - 18, 60, 30, 15); ctx.fill(); });
    // distant ridge + escarpment
    ctx.fillStyle = C.hill; ctx.beginPath(); ctx.moveTo(0, 520);
    for (var x = 0; x <= VW; x += 80) ctx.lineTo(x, 470 + Math.sin(x * 0.012) * 30 + Math.sin(x * 0.031) * 12);
    ctx.lineTo(VW, GROUND); ctx.lineTo(0, GROUND); ctx.fill();
    ctx.fillStyle = C.hill2; ctx.beginPath(); ctx.moveTo(0, 580);
    for (x = 0; x <= VW; x += 60) ctx.lineTo(x, 560 + Math.sin(x * 0.02 + 1) * 18);
    ctx.lineTo(VW, GROUND); ctx.lineTo(0, GROUND); ctx.fill();
    // palms
    [[90, 1], [620, 0.8], [1210, 1.1]].forEach(function (pl) {
      var px = pl[0], s = pl[1], sway = reduce ? 0 : Math.sin(t * 1.3 + px) * 4;
      ctx.strokeStyle = "#5b3447"; ctx.lineWidth = 9 * s; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(px, GROUND); ctx.quadraticCurveTo(px + 10 * s, GROUND - 90 * s, px + 4 * s + sway, GROUND - 170 * s); ctx.stroke();
      ctx.lineWidth = 7 * s;
      for (var k = 0; k < 6; k++) { var a = -2.6 + k * 0.85; ctx.beginPath(); ctx.moveTo(px + 4 * s + sway, GROUND - 170 * s); ctx.quadraticCurveTo(px + Math.cos(a) * 50 * s + sway, GROUND - 190 * s + Math.sin(a) * 20 * s, px + Math.cos(a) * 80 * s + sway, GROUND - 150 * s + Math.sin(a) * 30 * s); ctx.stroke(); }
    });
    ctx.lineCap = "butt";
    ctx.fillStyle = C.dirt; ctx.fillRect(0, GROUND, VW, VH - GROUND);
    ctx.fillStyle = C.grass; ctx.fillRect(0, GROUND, VW, 14);
    ctx.fillStyle = C.grassL; for (x = 0; x < VW; x += 32) ctx.fillRect(x + 6, GROUND, 12, 5);
    ctx.fillStyle = "#94492a"; for (x = 0; x < VW; x += 46) ctx.fillRect(x + 14, GROUND + 40 + (x % 3) * 12, 10, 6);
  }

  function drawSlingBack() {
    ctx.fillStyle = C.wood; ctx.strokeStyle = C.ink; ctx.lineWidth = 4;
    rr(ANCHOR.x - 10, ANCHOR.y + 10, 20, GROUND - ANCHOR.y - 10, 6); fillStroke(C.wood);
    rr(ANCHOR.x + 6, ANCHOR.y - 34, 16, 60, 6); fillStroke(C.woodD);
    rr(ANCHOR.x - 24, ANCHOR.y - 34, 16, 60, 6); fillStroke(C.wood);
  }
  function drawBand(front) {
    var bx = state === "ready" || dragging ? byte.position.x : ANCHOR.x + Math.sin(t * 40) * 6 * bandSnap;
    var by = state === "ready" || dragging ? byte.position.y : ANCHOR.y + Math.cos(t * 40) * 6 * bandSnap;
    ctx.strokeStyle = "#5b2a1f"; ctx.lineWidth = 7; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(front ? ANCHOR.x - 18 : ANCHOR.x + 14, ANCHOR.y - 26); ctx.lineTo(bx - (front ? 14 : -6), by); ctx.stroke();
    ctx.lineCap = "butt";
  }
  function drawAimDots() {
    if (state !== "ready") return;
    var vx = (ANCHOR.x - aim.x) * POWER, vy = (ANCHOR.y - aim.y) * POWER;
    if (Math.hypot(vx, vy) < 2) return;
    var x = aim.x, y = aim.y, g = engine.gravity.y * 0.001 * (1000 / 60) * (1000 / 60);
    ctx.fillStyle = "rgba(255,246,227,0.85)";
    for (var i = 0; i < 70; i++) {
      x += vx; y += vy; vy += g;
      if (i % 4 === 0) { ctx.beginPath(); ctx.arc(x, y, Math.max(2, 6 - i / 14), 0, 6.283); ctx.fill(); }
      if (y > GROUND) break;
    }
  }

  function drawPiece(p) {
    var b = p.body;
    ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
    var w = p.w, h = p.h, x = -w / 2, y = -h / 2;
    if (p.kind === "tray") {
      rr(x, y, w, h, 5); fillStroke(C.wood);
      ctx.fillStyle = C.woodL; ctx.fillRect(x + 6, y + 3, w - 12, 3);
      ctx.fillStyle = C.woodD; for (var k = x + 20; k < x + w - 10; k += 40) ctx.fillRect(k, y + h - 6, 10, 2);
    } else if (p.kind === "tickets") {
      rr(x, y, w, h, 4); fillStroke(C.ticket);
      ctx.strokeStyle = "#b4aac2"; ctx.lineWidth = 2;
      for (var ly = y + 12; ly < y + h - 8; ly += 9) { ctx.beginPath(); ctx.moveTo(x + 7, ly); ctx.lineTo(x + w - 7 - (ly % 3) * 4, ly); ctx.stroke(); }
      ctx.fillStyle = C.tray; ctx.fillRect(x + 2, y + 2, w - 4, 5);
    } else {
      var boss = p.kind === "boss";
      rr(x, y, w, h, 8); fillStroke(boss ? "#8a8f9c" : C.till);
      ctx.fillStyle = C.tillL; ctx.fillRect(x + 6, y + 5, w - 12, 4);
      rr(x + 8, y + 12, w - 16, h * 0.42, 5); fillStroke(p.out && boss ? "#8fbf4a" : (boss && Math.floor(t * 3) % 2 ? "#d6532b" : C.screen), 3);
      // faces: the boss till scowls until knocked down
      var fy = y + 12 + h * 0.21, fx = 0;
      ctx.fillStyle = C.ink;
      if (boss && !p.out) { ctx.fillRect(fx - 16, fy - 6, 10, 3); ctx.fillRect(fx + 6, fy - 6, 10, 3); ctx.fillRect(fx - 13, fy - 2, 5, 5); ctx.fillRect(fx + 8, fy - 2, 5, 5); }
      else if (boss) { ctx.beginPath(); ctx.arc(fx, fy - 2, 9, 0.2, 2.9); ctx.lineWidth = 3; ctx.stroke(); ctx.fillRect(fx - 12, fy - 6, 5, 5); ctx.fillRect(fx + 7, fy - 6, 5, 5); }
      else { ctx.fillStyle = "#7fd3ff"; ctx.fillRect(x + 12, fy - 3, w - 24, 3); }
      ctx.fillStyle = "#c4cad4"; for (var kx = x + 9; kx < x + w - 12; kx += 12) ctx.fillRect(kx, y + h - 20, 8, 6);
    }
    // label
    ctx.fillStyle = p.kind === "tray" ? C.ink : (p.kind === "tickets" ? C.ink : C.white);
    var label = SHORT[p.key];
    if (!label) { ctx.restore(); return; }
    var fs = p.kind === "tray" ? 13 : 13;
    ctx.font = fs + "px 'Lilita One', 'Arial Black', sans-serif"; ctx.textAlign = "center";
    if (p.kind === "tray") ctx.fillText(label, 0, 4);
    else { if (p.kind !== "tickets") { ctx.fillStyle = C.ink; } var words = label.split(" "); words.forEach(function (wd, i) { ctx.fillText(wd, 0, y + h - (p.kind === "tickets" ? 8 : 24) - (words.length - 1 - i) * 11); }); }
    ctx.textAlign = "left";
    ctx.restore();
    if (p.out) { ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle); ctx.fillStyle = C.coin; ctx.beginPath(); ctx.arc(x + w - 6, y + 6, 7, 0, 6.283); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke(); ctx.restore(); }
  }

  function drawByte() {
    var b = byte, flying = state === "flying" || state === "respawn";
    ctx.save(); ctx.translate(b.position.x, b.position.y);
    if (flying) ctx.rotate(b.angle * 0.4);
    var sq = 1 + squash * 0.3; ctx.scale(sq, 1 / sq);
    var R = BYTE_R, frill = flying || dragging ? 1 : 0.25 + 0.1 * Math.sin(t * 3);
    // tail
    ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.fillStyle = C.body;
    ctx.beginPath(); ctx.moveTo(-R + 4, 6); ctx.quadraticCurveTo(-R - 26, 14 + Math.sin(t * 8) * 4, -R - 30, -6); ctx.quadraticCurveTo(-R - 14, 6, -R + 6, -4); ctx.fill(); ctx.stroke();
    // frill
    var fr = R * (0.7 + frill * 0.75);
    ctx.beginPath(); ctx.arc(6, -6, fr, Math.PI * 0.55, Math.PI * 1.95); ctx.lineTo(6, -6); ctx.closePath(); fillStroke(C.frill, 4);
    ctx.beginPath(); ctx.arc(6, -6, fr * 0.65, Math.PI * 0.6, Math.PI * 1.9); ctx.lineTo(6, -6); ctx.closePath(); ctx.fillStyle = C.frillI; ctx.fill();
    ctx.strokeStyle = "#8f2f19"; ctx.lineWidth = 2;
    for (var k = 0; k < 5; k++) { var a = Math.PI * (0.7 + k * 0.27); ctx.beginPath(); ctx.moveTo(6, -6); ctx.lineTo(6 + Math.cos(a) * fr * 0.95, -6 + Math.sin(a) * fr * 0.95); ctx.stroke(); }
    // body
    ctx.beginPath(); ctx.ellipse(0, 0, R, R * 0.92, 0, 0, 6.283); fillStroke(C.body, 4);
    ctx.beginPath(); ctx.ellipse(4, 9, R * 0.6, R * 0.4, 0, 0, 6.283); ctx.fillStyle = C.belly; ctx.fill();
    // snout
    ctx.beginPath(); ctx.ellipse(R - 2, 2, 12, 9, 0, 0, 6.283); fillStroke(C.body, 4);
    ctx.fillStyle = C.ink; ctx.fillRect(R + 2, 4, 6, 2);
    // eye: follows the slingshot pull direction, spirals when dizzy
    ctx.beginPath(); ctx.arc(8, -6, 8, 0, 6.283); fillStroke(C.white, 3);
    if (dizzyT > 0 && !reduce) { ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); for (var s = 0; s < 12; s++) { var aa = s * 0.9 + t * 10; ctx.lineTo(8 + Math.cos(aa) * s * 0.5, -6 + Math.sin(aa) * s * 0.5); } ctx.stroke(); }
    else { var ex = flying ? 3 : (dragging ? -2 : 2); ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(8 + ex, -6, 3.5, 0, 6.283); ctx.fill(); }
    // determined brow when aiming
    if (dragging || state === "ready") { ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, -17); ctx.lineTo(15, -13); ctx.stroke(); }
    ctx.restore();
    // dizzy stars
    if (dizzyT > 0 && !reduce) for (var d = 0; d < 3; d++) { var an = t * 5 + d * 2.1; drawStar(b.position.x + Math.cos(an) * 26, b.position.y - 30 + Math.sin(an) * 7, 6); }
  }
  function drawStar(x, y, r) {
    ctx.fillStyle = C.coin; ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath();
    for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  function drawFX() {
    particles.forEach(function (q) { ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill(); });
    ctx.globalAlpha = 1;
    floaters.forEach(function (f) {
      ctx.globalAlpha = Math.max(0, 1 - f.t / 1.6);
      ctx.font = "22px 'Lilita One', 'Arial Black', sans-serif"; ctx.textAlign = "center";
      ctx.lineWidth = 6; ctx.strokeStyle = C.ink; ctx.strokeText(f.s, f.x, f.y - f.t * 40);
      ctx.fillStyle = f.c; ctx.fillText(f.s, f.x, f.y - f.t * 40);
      ctx.textAlign = "left"; ctx.globalAlpha = 1;
    });
  }
  function drawHUD() {
    ctx.font = "28px 'Lilita One', 'Arial Black', sans-serif";
    ctx.lineWidth = 6; ctx.strokeStyle = C.ink; ctx.fillStyle = "#fff6e3";
    var a = "STORY " + revealed + "/" + pieces.length, b = "LAUNCHES " + launches;
    ctx.strokeText(a, 28, 50); ctx.fillText(a, 28, 50);
    ctx.textAlign = "right"; ctx.strokeText(b, VW - 28, 50); ctx.fillText(b, VW - 28, 50); ctx.textAlign = "left";
  }

  function frame(now) {
    // Fixed 60 Hz simulation, whatever the screen's refresh rate
    var real = last ? Math.min(0.25, (now - last) / 1000) : STEP; last = now;
    acc += real;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 12, (Math.random() - 0.5) * shake * 8);
    drawBG(); drawSlingBack(); drawBand(false);
    pieces.forEach(drawPiece);
    drawAimDots(); drawByte(); drawBand(true); drawFX(); drawHUD();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.getElementById("play-btn").focus({ preventScroll: true });
})();
</script>

    ctx.quadraticCurveTo(cx, cy - h * 2, cx + w, cy);
    ctx.quadraticCurveTo(cx, cy + h * 2, cx - w, cy);
    ctx.closePath();
  }
  function draw(dt) {
    t += dt; busy = Math.max(0, busy - dt); if (!busy) idle += dt;
    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1.5; ctx.lineCap = "round"; ctx.lineJoin = "round";

    // eye: where to look
    var ex = W / 2, ey = 30, tx = 0, ty = 0;
    if (busy > 0 && lastKey) { tx = (lastKey.x + lastKey.w / 2 - ex) / 9; ty = 7; }
    else if (mouse.x >= 0) { tx = (mouse.x - ex) / 10; ty = (mouse.y - ey) / 10; }
    else { tx = Math.sin(t * 0.4) * 6; }
    tx = Math.max(-20, Math.min(20, tx)); ty = Math.max(-6, Math.min(7, ty));
    gaze.x += (tx - gaze.x) * Math.min(1, dt * 10); gaze.y += (ty - gaze.y) * Math.min(1, dt * 10);
    // blinking, and drowsy after a long quiet spell
    nextBlink -= dt; if (nextBlink < -0.14) nextBlink = 2.5 + Math.random() * 3;
    var open = nextBlink < 0 ? 0.08 : idle > 25 ? 0.35 : 1;
    var w = 46, h = 13 * open;
    ctx.save(); almond(ex, ey, w, h); ctx.clip();
    ctx.strokeStyle = INK; ctx.beginPath(); ctx.arc(ex + gaze.x, ey + gaze.y, 12, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = busy > 0 ? ACC : INK; ctx.beginPath(); ctx.arc(ex + gaze.x, ey + gaze.y, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BG; ctx.beginPath(); ctx.arc(ex + gaze.x + 2, ey + gaze.y - 2, 1.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = busy > 0 ? ACC : INK; almond(ex, ey, w, h); ctx.stroke();

    // keyboard
    ctx.font = "9px 'IBM Plex Mono', monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    Object.keys(KEYS).forEach(function (ch) {
      var k = KEYS[ch], l = lit[ch] || 0;
      if (l) lit[ch] = Math.max(0, l - dt * 3.5);
      if (l > 0) { ctx.globalAlpha = l; ctx.fillStyle = ACC; ctx.fillRect(k.x, k.y, k.w, KH); ctx.globalAlpha = 1; }
      ctx.strokeStyle = l > 0.2 ? ACC : FAINT; ctx.strokeRect(k.x + 0.5, k.y + 0.5, k.w - 1, KH - 1);
      ctx.fillStyle = l > 0.55 ? BG : l > 0.05 ? INK : FAINT; ctx.fillText(k.label, k.x + k.w / 2, k.y + KH / 2 + 0.5);
    });
  }
  function frame(now) { var dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now; draw(dt); requestAnimationFrame(frame); }
  if (reduce) { draw(0); window.addEventListener("resize", function () { draw(0); }); } else requestAnimationFrame(frame);

  show(0);
})();
</script>

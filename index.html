<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shuvang Arjyal</title>
<meta name="description" content="Shuvang Arjyal: IT support, Darwin. Four years running restaurant shifts, now an IT graduate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: one calm column like a quiet text editor. Tabs on top, typed text in the middle,
   Byte at a keyboard below, a plain-English status bar at the bottom. Dark and warm, single theme by design. */
:root {
  --bg: #121110;
  --panel: #191715;
  --ink: #e8dfcf;
  --soft: #b3aa9b;
  --faint: #6f675c;
  --line: #2a2723;
  --accent: #e0a458;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.75 var(--mono);
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
a { color: var(--accent); text-underline-offset: 3px; }

.page {
  min-height: 100%; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column;
  padding: 28px max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px));
}
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.who { font-weight: 500; letter-spacing: 0.02em; }
.who span { color: var(--faint); font-weight: 400; }
.avail { color: var(--soft); font-size: 13px; }
.avail::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: 0.35; } }

.tabs { display: flex; gap: 2px; margin: 28px 0 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; font: inherit; font-size: 14px; color: var(--faint); background: none; border: 0;
  border-bottom: 2px solid transparent; padding: 10px 14px 9px; cursor: pointer; transition: color 0.2s;
}
.tab:hover { color: var(--soft); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); background: var(--panel); }

.screen { flex: 1; padding: 30px 0 24px; min-height: 340px; cursor: text; }
.screen:focus { outline: none; }
.ln { min-height: 1.75em; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 66ch; }
.ln.h { color: var(--accent); margin-top: 18px; }
.ln.h:first-child { margin-top: 0; }
.ln.big { font-size: clamp(22px, 4vw, 30px); line-height: 1.3; color: var(--ink); margin-bottom: 10px; }
.ln.dim { color: var(--soft); }
.ln.li { padding-left: 1.6em; text-indent: -1.6em; }
.ln.li::before { content: "–  "; color: var(--faint); }
.tbc { color: var(--accent); border: 1px dashed var(--accent); border-radius: 3px; padding: 0 6px; font-style: italic; font-size: 13px; }
.cursor { display: inline-block; width: 0.6em; height: 1.15em; background: var(--accent); vertical-align: -0.2em; margin-left: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.mail { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 6px 0; }
.mail-addr { font-size: clamp(17px, 3vw, 22px); color: var(--ink); }
.btn { font: inherit; font-size: 13px; color: var(--bg); background: var(--accent); border: 0; border-radius: 4px; padding: 5px 12px; cursor: pointer; }
.btn.ghost { color: var(--ink); background: none; border: 1px solid var(--line); text-decoration: none; }
.btn:hover { filter: brightness(1.1); }
.skip { color: var(--faint); font-size: 12px; margin-top: 18px; }

.desk { display: flex; justify-content: center; padding: 6px 0 4px; }
#byte { width: 260px; height: 104px; display: block; }

.status {
  position: sticky; bottom: 0; margin: 0 calc(-1 * max(20px, env(safe-area-inset-left, 0px)));
  display: flex; justify-content: space-between; gap: 12px; font-size: 12px;
  padding: 7px max(20px, env(safe-area-inset-right, 0px)) calc(7px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  background: var(--panel); border-top: 1px solid var(--line); color: var(--soft);
}
.status b { color: var(--bg); background: var(--accent); font-weight: 500; padding: 0 8px; margin-right: 10px; border-radius: 2px; }
.status .keys { color: var(--faint); }
@media (max-width: 560px) {
  body { font-size: 14px; }
  .status .keys, .avail { display: none; }
  #byte { width: 210px; height: 84px; }
}
@media (pointer: coarse) { .status .keys { display: none; } }
@media (prefers-reduced-motion: reduce) { .cursor, .avail::before { animation: none; } }
</style>

<div class="page">
  <header>
    <div class="who">Shuvang Arjyal <span>· IT support · Darwin</span></div>
    <div class="avail">available now</div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>

  <main class="screen" id="screen" role="tabpanel" tabindex="-1" aria-live="polite"></main>

  <div class="desk" aria-hidden="true"><canvas id="byte"></canvas></div>

  <footer class="status" id="status"><span id="status-l"></span><span class="keys">← → switch tabs · click to skip typing</span></footer>
</div>

<script>
(function () {
  "use strict";
  var EMAIL = "you@example.com";

  /* ---------- Content: plain English, one list of lines per tab ----------
     type: h (heading), big, dim, li (list item), tbc (still to confirm), gap, mail, links */
  var TABS = [
    { name: "About", lines: [
      ["big", "Hi, I'm Shuvang"],
      ["", "I ran fast-food shifts for four years, at McDonald's and Nando's"],
      ["", "Things break at the busiest moment there, and someone has to sort it out"],
      ["", "Now I'm an IT graduate looking for an IT support role in Darwin"],
      ["gap"],
      ["dim", "Full work rights · available to start now"],
      ["h", "How I work"],
      ["li", "I write down how I fixed something, so the next person can fix it faster"],
      ["li", "I train people, so they need help less often"],
      ["tbc", "To confirm: one more habit you'd bring to a help desk"]
    ] },
    { name: "Rush hour", lines: [
      ["big", "The night the system went down"],
      ["dim", "McDonald's · Shift Manager · 8 to 15 staff on a busy shift"],
      ["h", "What stopped working"],
      ["tbc", "To confirm: tills, ordering screens or app, and how busy it was"],
      ["h", "What I tried first"],
      ["tbc", "To confirm: for example restarting it or checking cables, and why"],
      ["h", "Who I called"],
      ["tbc", "To confirm: who you rang and what you told them"],
      ["h", "Keeping customers served"],
      ["tbc", "To confirm: how orders kept going while it was fixed"],
      ["h", "What changed after"],
      ["tbc", "To confirm: a checklist, some training, or a habit you kept"]
    ] },
    { name: "DGK", lines: [
      ["big", "DGK Business Consultancy"],
      ["dim", "IT and automation internship · 2026"],
      ["", "I set up tools that do repetitive office work by themselves, and wrote step-by-step guides so others can use them"],
      ["h", "Video outreach that checks itself"],
      ["li", "Someone asks for a video in a chat"],
      ["li", "The assistant looks at the business's website and scores it from 1 to 10"],
      ["li", "Below 7, it stops and writes down why"],
      ["li", "7 or above, it makes a personal video and fills in the spreadsheet"],
      ["li", "It only runs when someone asks, so nothing runs in the background for no reason"],
      ["h", "An assistant with a team of helpers"],
      ["", "One main assistant hands jobs to eight helpers: finding job leads on SEEK, Indeed, Glassdoor and LinkedIn, writing outreach, making posts, summarising videos, cutting short clips, and writing tasks once they're approved"],
      ["dim", "Mostly working · still building"],
      ["h", "Which companies visit a website"],
      ["", "I adapted a ready-made template: a visit comes in, the process works out which company it came from, and saves it as a possible customer"],
      ["", "Most visits came from home and phone connections, not businesses"],
      ["tbc", "To confirm: rough numbers, and how you dealt with that"],
      ["h", "Step-by-step guides"],
      ["", "15 finished guides, written and recorded, with more in progress. For example: the interns' daily routine, editing forms in the company's customer system, scheduling posts, and setting up an AI assistant, including how to check it's healthy and read its logs"],
      ["h", "Also"],
      ["", "Posting to several social networks at once with automatic replies, setting up WhatsApp and Google Workspace tools, and making images, videos and posts with AI"]
    ] },
    { name: "Skills", lines: [
      ["h", "In numbers"],
      ["li", "4 years running shifts, since September 2022"],
      ["li", "8 to 15 staff on a busy shift"],
      ["li", "2 jobs at once: McDonald's and Nando's"],
      ["li", "15 finished step-by-step guides at DGK"],
      ["h", "Things I've done"],
      ["li", "Set up and fixed tools that run from the command line, including their settings and logs"],
      ["li", "Connected programs so they pass information to each other: Airtable, Google Sheets, a customer system, WhatsApp"],
      ["li", "Looked after forms and scheduled posts in a company's customer system"],
      ["li", "Trained new staff, regularly"],
      ["h", "Qualifications"],
      ["li", "Bachelor of Information Technology, Charles Darwin University, 2025"],
      ["li", "ACS Professional Year (ICT), NIT Darwin, 2026"],
      ["li", "Member, Australian Computer Society"],
      ["li", "Online courses: ISC2 Certified in Cybersecurity, CompTIA Tech+, CISA IT management"],
      ["li", "First Aid / CPR and RSA, current"]
    ] },
    { name: "Contact", lines: [
      ["big", "Let's talk"],
      ["", "Based in Darwin with full work rights, available to start now"],
      ["", "Email me and I'll reply within a day"],
      ["mail"],
      ["tbc", "To confirm: your real email"],
      ["links"],
      ["tbc", "To confirm: LinkedIn link and CV file"]
    ] }
  ];

  /* ---------- Tabs ---------- */
  var tabsEl = document.getElementById("tabs"), screen = document.getElementById("screen"), statusL = document.getElementById("status-l");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var current = 0, typing = null;
  TABS.forEach(function (t, i) {
    var b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab"); b.id = "tab-" + i;
    b.textContent = t.name;
    b.addEventListener("click", function () { show(i); });
    tabsEl.appendChild(b);
  });

  function lineEl(l) {
    var d = document.createElement("div");
    var type = l[0];
    d.className = "ln" + (type && type !== "tbc" && type !== "gap" && type !== "mail" && type !== "links" ? " " + type : "");
    if (type === "tbc") { var s = document.createElement("span"); s.className = "tbc"; d.appendChild(s); d._target = s; }
    else if (type === "mail") {
      d.className = "ln mail";
      d.innerHTML = '<span class="mail-addr" id="mail-addr">' + EMAIL + '</span><button class="btn" type="button" data-copy>copy</button><a class="btn ghost" href="mailto:' + EMAIL + '">open mail</a>';
      d._instant = true;
    } else if (type === "links") {
      d.innerHTML = '<span class="dim">LinkedIn · CV</span>';
      d._instant = true;
    } else d._target = d;
    d._text = l[1] || "";
    return d;
  }

  function show(i, quiet) {
    current = (i + TABS.length) % TABS.length;
    [].forEach.call(tabsEl.children, function (b, j) { b.setAttribute("aria-selected", j === current ? "true" : "false"); b.tabIndex = j === current ? 0 : -1; });
    screen.setAttribute("aria-labelledby", "tab-" + current);
    statusL.innerHTML = "<b>" + TABS[current].name + "</b>Darwin, NT · full work rights · available now";
    tabsEl.children[current].scrollIntoView({ block: "nearest", inline: "nearest", behavior: reduce ? "auto" : "smooth" });
    startTyping(TABS[current].lines.map(lineEl));
  }

  /* ---------- Typing ---------- */
  var cursor = document.createElement("span"); cursor.className = "cursor";
  function startTyping(lines) {
    if (typing) clearInterval(typing);
    screen.innerHTML = "";
    var li = 0, ci = 0;
    function place(el) { el.appendChild(cursor); }
    function finish() {
      clearInterval(typing); typing = null;
      for (; li < lines.length; li++) { var L = lines[li]; if (!L.isConnected) screen.appendChild(L); if (L._target) L._target.textContent = L._text; }
      var last = screen.lastElementChild; if (last) place(last._target || last);
      busy = 0;
    }
    startTyping.finish = finish;
    if (reduce) { finish(); return; }
    typing = setInterval(function () {
      var L = lines[li];
      if (!L) { finish(); return; }
      if (!L.isConnected) { screen.appendChild(L); ci = 0; }
      if (L._instant || !L._text) { li++; return; }
      ci += L._text.length > 90 ? 3 : 2;
      L._target.textContent = L._text.slice(0, ci);
      place(L._target);
      busy = 0.25;
      if (ci >= L._text.length) { li++; }
    }, 22);
  }
  screen.addEventListener("click", function (e) { if (typing && !e.target.closest("button, a")) startTyping.finish(); });

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-copy]"); if (!b) return;
    function done() { b.textContent = "copied"; setTimeout(function () { b.textContent = "copy"; }, 1500); }
    function sel() { var a = document.getElementById("mail-addr"); var r = document.createRange(); r.selectNodeContents(a); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    try { navigator.clipboard.writeText(EMAIL).then(done, sel); } catch (err) { sel(); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.target.closest && e.target.closest("input, textarea")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); show(current + 1); tabsEl.children[current].focus(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); show(current - 1); tabsEl.children[current].focus(); }
    else if (e.key.length === 1 || e.key === "Enter" || e.key === "Backspace") { userTap(); }
  });

  /* ---------- Byte, line-drawn, typing at a little keyboard ---------- */
  var cv = document.getElementById("byte"), ctx = cv.getContext("2d");
  var W = 260, H = 104, busy = 0, tapT = 0, idle = 0, mouse = { x: -1, y: -1 }, t = 0, last = 0, keyLit = -1, paw = 0;
  function fit() { var r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0); }
  fit(); window.addEventListener("resize", fit);
  window.addEventListener("pointermove", function (e) { var r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) / r.width * W; mouse.y = (e.clientY - r.top) / r.height * H; idle = 0; });
  function userTap() { busy = 0.35; idle = 0; }

  var INK = "#b3aa9b", FAINT = "#4a443d", ACC = "#e0a458";
  function draw(dt) {
    t += dt;
    if (busy > 0) { busy -= dt; idle = 0; tapT += dt; if (tapT > 0.09) { tapT = 0; paw = 1 - paw; keyLit = Math.floor(Math.random() * 20); } }
    else { idle += dt; keyLit = -1; }
    var nap = idle > 25;
    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1.5; ctx.lineCap = "round"; ctx.lineJoin = "round";
    // keyboard
    ctx.strokeStyle = FAINT; ctx.strokeRect(70, 76, 120, 22);
    for (var r = 0; r < 2; r++) for (var c = 0; c < 10; c++) {
      var k = r * 10 + c;
      ctx.strokeStyle = k === keyLit ? ACC : FAINT;
      ctx.strokeRect(74 + c * 11.4, 79 + r * 9, 8, 6);
    }
    // body
    var bob = busy > 0 ? Math.sin(t * 30) * 0.6 : Math.sin(t * 2) * 0.5;
    ctx.strokeStyle = INK;
    ctx.beginPath(); ctx.ellipse(128, 58 + bob, 22, 14, 0, 0, Math.PI * 2); ctx.stroke();
    // tail curling to the left
    ctx.beginPath(); ctx.moveTo(107, 62 + bob); ctx.quadraticCurveTo(80, 70, 72 + Math.sin(t * 2) * 2, 52); ctx.stroke();
    // frill: a fan of lines behind the head, opens while typing
    var open = nap ? 0.25 : busy > 0 ? 1 : 0.55;
    ctx.strokeStyle = busy > 0 ? ACC : INK;
    for (var i = 0; i < 7; i++) {
      var a = Math.PI * (1.05 + i * 0.13), len = 10 + open * 9;
      ctx.beginPath(); ctx.moveTo(140, 36 + bob); ctx.lineTo(140 + Math.cos(a) * len, 36 + bob + Math.sin(a) * len); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(140, 36 + bob, 10 + open * 9, Math.PI * 1.05, Math.PI * 1.85); ctx.stroke();
    // head
    ctx.strokeStyle = INK;
    ctx.beginPath(); ctx.ellipse(150, 38 + bob, 13, 9, -0.15, 0, Math.PI * 2); ctx.stroke();
    // eye follows the mouse, blinks, closes when napping
    var ex = 152, ey = 35 + bob;
    var blink = nap || (t % 4.2) < 0.12;
    if (blink) { ctx.beginPath(); ctx.moveTo(ex - 3, ey); ctx.lineTo(ex + 3, ey); ctx.stroke(); }
    else {
      ctx.beginPath(); ctx.arc(ex, ey, 3.5, 0, Math.PI * 2); ctx.stroke();
      var px = 0, py = 0;
      if (mouse.x >= 0) { var dx = mouse.x - ex, dy = mouse.y - ey, d = Math.hypot(dx, dy) || 1; px = dx / d * 1.6; py = dy / d * 1.6; }
      else if (busy > 0) py = 1.6;
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(ex + px, ey + py, 1.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.beginPath(); ctx.moveTo(156, 42 + bob); ctx.lineTo(161, 41 + bob); ctx.stroke();
    // arms down to the keys, tapping in turn
    var lUp = busy > 0 && paw === 0 ? -4 : 0, rUp = busy > 0 && paw === 1 ? -4 : 0;
    ctx.beginPath(); ctx.moveTo(118, 66 + bob); ctx.lineTo(112, 78 + lUp); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(140, 66 + bob); ctx.lineTo(148, 78 + rUp); ctx.stroke();
    // little zzz when napping
    if (nap) { ctx.fillStyle = INK; ctx.font = "10px 'IBM Plex Mono', monospace"; var z = (t % 2) / 2; ctx.globalAlpha = 1 - z; ctx.fillText("z", 168 + z * 8, 26 - z * 10); ctx.globalAlpha = 1; }
  }
  function frame(now) { var dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now; draw(dt); requestAnimationFrame(frame); }
  if (reduce) draw(0); else requestAnimationFrame(frame);

  show(0);
})();
</script>
</html>

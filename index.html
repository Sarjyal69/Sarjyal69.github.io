<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Byte's Shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one 320x180 pixel canvas scaled crisp, with HTML overlays (title, text boxes, boss, ending, quick view) on top.
   Single theme by design: the game world sets its own colours. */
:root {
  --frame: #1b1a26;
  --ink: #f4ead2;
  --muted: #a49cb2;
  --key: #2c2a3a;
  --accent: #f2a03d;
  --red: #d6532b;
  --box: #1b1a26;
  --pixel: "Press Start 2P", "Courier New", monospace;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--frame); color: var(--ink); font: 10px/1.8 var(--pixel);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; user-select: none; -webkit-user-select: none; overflow: hidden;
}
.topbar { width: min(100%, 1100px, calc((100vh - 150px) * 16 / 9)); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.topbar .who { color: var(--muted); font-size: 9px; }
.tb-btns { display: flex; gap: 8px; }
.btn { font: 9px/1 var(--pixel); color: var(--ink); background: var(--key); border: 0; border-bottom: 3px solid #000; padding: 9px 11px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { background: #3b3850; }
.btn:active { transform: translateY(2px); border-bottom-width: 1px; }
.btn[aria-pressed="true"] { color: var(--accent); }
.btn.primary { background: var(--accent); color: #1b1a26; }
.btn.primary:hover { background: #ffbe63; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.screen { position: relative; width: min(100%, 1100px, calc((100vh - 150px) * 16 / 9)); aspect-ratio: 16 / 9; }
canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: 4px solid #000; touch-action: none; }
.help { text-align: center; color: var(--muted); font-size: 9px; margin: 0; }
.help b { color: var(--ink); font-weight: 400; }
.pad { display: none; gap: 10px; }
.pad button { font: 16px var(--pixel); color: var(--ink); background: var(--key); border: 0; border-bottom: 4px solid #000; width: 68px; height: 58px; touch-action: none; }
.pad button.on { transform: translateY(2px); border-bottom-width: 2px; background: #3b3850; }
@media (pointer: coarse) { .pad { display: flex; } .help { display: none; } }

/* Overlays sit on the game screen */
.ov { position: absolute; inset: 0; display: grid; place-items: center; padding: 3%; }
.ov[hidden] { display: none; }
.dlg {
  width: min(92%, 640px); max-height: 92%; overflow: auto; background: var(--box); color: var(--ink);
  border: 4px solid var(--ink); box-shadow: 0 0 0 4px #000, 8px 8px 0 4px rgb(0 0 0 / 0.5);
  padding: clamp(14px, 2.4vw, 24px); animation: pop 0.22s steps(4);
}
.dlg:focus { outline: none; }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } }
.dlg h2 { margin: 0 0 12px; font: clamp(10px, 1.3vw, 14px)/1.5 var(--pixel); color: var(--accent); }
.dlg .body { font: 400 clamp(13px, 1.5vw, 16px)/1.6 var(--mono); user-select: text; -webkit-user-select: text; }
.dlg .body p { margin: 0 0 10px; }
.dlg .more { margin-top: 8px; font: 9px var(--pixel); color: var(--muted); text-align: right; animation: blink 0.8s steps(2) infinite; cursor: pointer; }
@keyframes blink { 50% { opacity: 0; } }
.tbc { color: var(--accent); border: 1px dashed var(--accent); padding: 0 5px; font: 400 0.85em/1.5 var(--mono); white-space: normal; }
.choices { display: grid; gap: 8px; margin-top: 14px; }
.choice { text-align: left; font: 400 clamp(13px, 1.5vw, 15px)/1.4 var(--mono); color: var(--ink); background: var(--key); border: 0; border-left: 4px solid transparent; padding: 10px 12px; cursor: pointer; }
.choice:hover, .choice:focus-visible { border-left-color: var(--accent); background: #3b3850; outline: none; }
.choice:focus-visible::before, .choice:hover::before { content: "▶ "; color: var(--accent); }
.verdict { padding: 10px 12px; border-left: 4px solid #8fbf4a; background: rgb(143 191 74 / 0.12); margin-bottom: 10px; }
.verdict.bad { border-color: var(--red); background: rgb(214 83 43 / 0.15); }
.hud-line { display: flex; justify-content: space-between; gap: 8px; font: 9px var(--pixel); color: var(--muted); margin-bottom: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

.title { text-align: center; background: rgb(27 26 38 / 0.55); }
.title-inner { display: grid; gap: 14px; justify-items: center; }
.title h1 { margin: 0; font: clamp(20px, 4.4vw, 46px)/1.25 var(--pixel); color: var(--ink); text-shadow: 4px 4px 0 #000; }
.title h1 span { color: var(--accent); }
.title p { margin: 0; font: clamp(8px, 1.2vw, 12px)/1.8 var(--pixel); color: var(--ink); text-shadow: 2px 2px 0 #000; }
.title .start { font-size: clamp(11px, 1.5vw, 15px); padding: 14px 18px; animation: blink 1.1s steps(2) infinite; }
.title .start:hover, .title .start:focus-visible { animation: none; }

.quick { width: min(94%, 760px); }
.quick h3 { font: 10px var(--pixel); color: var(--accent); margin: 18px 0 8px; }
.mail { font: 600 clamp(15px, 2vw, 20px) var(--mono); color: var(--ink); overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { .dlg, .title .start, .dlg .more { animation: none; } }
</style>

<div class="topbar">
  <span class="who">SHUVANG ARJYAL · IT SUPPORT · DARWIN</span>
  <div class="tb-btns">
    <button class="btn" type="button" id="quick-btn">QUICK VIEW</button>
    <button class="btn" type="button" id="snd" aria-pressed="false">SOUND OFF</button>
  </div>
</div>

<div class="screen" id="screen">
  <canvas id="c" width="320" height="180" tabindex="0" aria-label="Byte's Shift: a playable portfolio. Arrow keys to walk, Space to jump. Or scroll to walk. Quick view has everything as text."></canvas>

  <div class="ov title" id="title">
    <div class="title-inner">
      <h1>BYTE'S <span>SHIFT</span></h1>
      <p>A PLAYABLE PORTFOLIO BY SHUVANG ARJYAL<br>IT SUPPORT · DARWIN, NT · AVAILABLE NOW</p>
      <button class="btn primary start" type="button" id="start-btn">PRESS START</button>
      <button class="btn" type="button" id="title-quick">NO TIME? QUICK VIEW</button>
    </div>
  </div>

  <div class="ov" id="dlg-ov" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t" tabindex="-1"><h2 id="dlg-t"></h2><div class="body" id="dlg-b"></div><div class="more" id="dlg-more">▼ ENTER</div></div></div>
</div>

<div class="pad" aria-label="Touch controls">
  <button type="button" data-k="left" aria-label="Left">◀</button>
  <button type="button" data-k="right" aria-label="Right">▶</button>
  <button type="button" data-k="jump" aria-label="Jump">▲</button>
</div>
<p class="help"><b>← →</b> walk (hold to run) · <b>SPACE</b> jump · <b>ENTER</b> close text · or just <b>scroll</b> to walk</p>

<script>
(function () {
  "use strict";
  function T(s) { return '<span class="tbc">' + s + "</span>"; }
  var EMAIL = "you@example.com";

  /* ================= Content (one source for the level and the quick view) ================= */
  var BLOCKS = [
    { x: 190, title: "WELCOME", body: "<p>I'm Shuvang. I spent four years running fast-food shifts, where things break at the busiest moment and someone has to sort it out.</p><p>I'm now an IT graduate looking for a support role in Darwin. Full work rights, available now.</p>" },
    { x: 430, title: "SINCE 2022", body: "<p>Shift Manager at McDonald's and Shift Leader at Nando's since September 2022.</p><p>A lot of the job is the same as IT support: work out what's wrong, fix what I can, call in help for what I can't, and keep everyone in the loop.</p>" },
    { x: 560, title: "CREW", body: "<p>8 to 15 people on a busy shift I run.</p>" },
    { x: 690, title: "TRAINING", body: "<p>I train new starters regularly. Someone who knows why something works needs help less often.</p>" },
    { x: 1150, title: "DEGREE", body: "<p>Bachelor of Information Technology, Charles Darwin University, 2025.</p>" },
    { x: 1280, title: "PROFESSIONAL YEAR", body: "<p>ACS Professional Year (ICT) at NIT Darwin, completed 2026. Member of the Australian Computer Society.</p>" },
    { x: 1410, title: "COURSES", body: "<p>Online courses (Skillsoft): ISC2 Certified in Cybersecurity, CompTIA Tech+, CISA IT management frameworks.</p><p>Also current First Aid / CPR and RSA.</p>" },
    { x: 1690, title: "DGK INTERNSHIP", body: "<p>An internship at DGK Business Consultancy, setting up tools that do repetitive office work automatically. Mostly getting different programs to pass information to each other, so nobody copies it across by hand.</p>" },
    { x: 1820, title: "WEBSITE LEADS", body: "<p>DGK wanted to know which businesses visited its website. I adapted a ready-made template into a process that notices each visit, works out which company it came from, and saves it as a possible customer.</p><p>The catch: most visits came from home and phone internet connections, not businesses. Looking up every one also cost money. " + T("To confirm: how you dealt with it, and rough numbers") + "</p>" },
    { x: 1950, title: "LOOKING AFTER DATA", body: "<p>Who visits a website can count as personal information, so I checked how it was handled. Visitors saw a tracking notice, and the passwords connecting the tools were stored securely, not left where anyone could see them.</p>" },
    { x: 2070, title: "CHECKING WORK", body: "<p>I checked two teammates' work before it was marked done. Same as checking a closing shift, different setting.</p>" },
    { x: 2300, title: "BUILDING NOW", body: "<p>An AI assistant that works like a chief of staff, handing jobs to smaller helpers: Task Manager, Lead Finder, Outbound, Content, LinkedIn Watcher, Video Watcher, Video Editor and Asana Ops. Most of them work now.</p><p>" + T("To confirm: what it does day to day, and which helpers work") + "</p>" }
  ];
  var BOSS = [
    { q: "Friday dinner rush. The queue is out the door, and the tills just froze mid-order. First move?",
      c: [["Call the help line straight away", 1, "Help is good, but the first thing they'll ask is what you've already tried."],
          ["Turn the tills off and on again", 3, "Good first move. A lot of freezes clear with a restart, and it only takes a minute."],
          ["Hide in the cool room", 0, "Tempting. The queue is still there when you come out."]] },
    { q: "The restart didn't fix it. Tickets are piling up and people are getting restless.",
      c: [["Tell everyone the system is 'having a moment' and hope", 0, "Honest, at least. Hope is not a plan."],
          ["Stop serving until it's fixed", 1, "Safe, but you lose customers and the team stands around."],
          ["Take orders on paper while someone keeps working on the tills", 3, "Food keeps moving and the problem still gets worked on."]] },
    { q: "The tills are back and service is catching up. Now what?",
      c: [["Write down what happened and what fixed it", 3, "Next time, whoever is on shift can fix it faster."],
          ["Blame the fryer", 0, "The fryer was not involved."],
          ["Forget it and get back to work", 1, "Fair on a busy night, but the same thing will catch out the next manager."]] }
  ];

  /* ================= Setup ================= */
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  var W = 320, H = 180, GROUND = 148, WORLD = 2640;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var FONT = "8px 'Press Start 2P', monospace";

  var P = {
    black: "#1b1a26", white: "#fffbe8",
    body: "#c9893b", bodyD: "#94602a", belly: "#ecc684", frill: "#d6532b", frillI: "#f2a03d", eye: "#fffbe8",
    dirt: "#a4542f", dirtD: "#7a3a25", grass: "#6c8f3a", grassL: "#9cb94c",
    block: "#e7a83a", blockD: "#9b5d1c", blockL: "#ffd77a", coin: "#ffd23f", coinD: "#c08a14",
    brick: "#b5523a", brickD: "#7c3424"
  };
  // Sky keyframes across the level: morning, afternoon, sunset, night
  var SKY = [
    [0.00, ["#9fd4f0", "#c5e6f2", "#f4e2b8"], ["#9bb4c4", "#7c95a8"]],
    [0.35, ["#f6c27a", "#f0a55e", "#e3824f"], ["#b8675a", "#8a4b52"]],
    [0.65, ["#e3824f", "#b8546a", "#5b3a6b"], ["#7a3f5a", "#55304d"]],
    [0.88, ["#1d2245", "#2b2c5a", "#3d3166"], ["#2a2550", "#1f1b3d"]]
  ];
  function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function mix(a, b, k) { var A = hex(a), B = hex(b); return "rgb(" + A.map(function (v, i) { return Math.round(v + (B[i] - v) * k); }).join(",") + ")"; }
  function skyAt(p) {
    for (var i = 0; i < SKY.length - 1; i++) {
      if (p <= SKY[i + 1][0]) {
        var k = (p - SKY[i][0]) / (SKY[i + 1][0] - SKY[i][0]);
        return { s: SKY[i][1].map(function (c, j) { return mix(c, SKY[i + 1][1][j], k); }), l: SKY[i][2].map(function (c, j) { return mix(c, SKY[i + 1][2][j], k); }) };
      }
    }
    var L = SKY[SKY.length - 1]; return { s: L[1], l: L[2] };
  }

  var ZONES = [
    { to: 330, name: "DARWIN", year: "START", outfit: null },
    { from: 330, to: 1000, name: "RESTAURANT", year: "2022", outfit: "crew" },
    { from: 1000, to: 1560, name: "CDU", year: "2025", outfit: "student" },
    { from: 1560, to: 2180, name: "DGK", year: "2025-26", outfit: "office" },
    { from: 2180, to: WORLD + 100, name: "NOW", year: "2026", outfit: "support" }
  ];
  function zoneAt(x) { for (var i = 0; i < ZONES.length; i++) if (x < ZONES[i].to) return ZONES[i]; return ZONES[ZONES.length - 1]; }

  /* ================= State ================= */
  var keys = { left: false, right: false, jump: false };
  var byte = { x: 60, y: GROUND, vx: 0, vy: 0, face: 1, ground: true, sx: 1, sy: 1, frill: 0, walkT: 0, idleT: 0, blinkT: 2, wave: 0, coyote: 0, jumpBuf: 0, hold: 0 };
  var cam = 0, t = 0, last = 0, shake = 0;
  var dust = [], coins = [], sparks = [], birds = [], clouds = [], tickets = [], fireworks = [], floaters = [];
  var mouse = { x: -1, y: -1, over: false };
  var scrollTarget = null, playing = false, paused = true, outfit = null, coinCount = 0;
  var boss = { x: 920, state: "idle" };
  var gate = { x: 880, open: false };
  var flag = { x: 2560, reached: false };
  var npc = { x: 260, dir: -1, f: 0 };

  var solids = [];
  BLOCKS.forEach(function (b, i) { solids.push({ type: "q", x: b.x - 8, y: 100, w: 16, h: 16, bump: 0, used: false, i: i }); });
  [[300, 116, 32], [760, 108, 48], [1520, 112, 32], [2140, 104, 40], [2420, 112, 48]].forEach(function (p) { solids.push({ type: "brick", x: p[0], y: p[1], w: p[2], h: 8, bump: 0 }); });
  for (var i = 0; i < 9; i++) clouds.push({ x: Math.random() * WORLD, y: 12 + Math.random() * 40, s: 0.5 + Math.random() * 0.7 });
  var stars = []; for (var s = 0; s < 40; s++) stars.push({ x: Math.random() * W, y: Math.random() * 90, p: Math.random() * 6 });

  /* ================= Sound (off by default) ================= */
  var soundOn = false, actx = null;
  function beep(f1, f2, d, type) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain(), n = actx.currentTime;
      o.type = type || "square"; o.frequency.setValueAtTime(f1, n);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, n + d);
      g.gain.setValueAtTime(0.04, n); g.gain.exponentialRampToValueAtTime(0.0001, n + d);
      o.connect(g); g.connect(actx.destination); o.start(n); o.stop(n + d);
    } catch (e) {}
  }
  var snd = document.getElementById("snd");
  snd.addEventListener("click", function () {
    soundOn = !soundOn; snd.setAttribute("aria-pressed", soundOn); snd.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    beep(660, 990, 0.1);
  });

  /* ================= Overlays ================= */
  var dlgOv = document.getElementById("dlg-ov"), dlg = dlgOv.firstElementChild;
  var dlgT = document.getElementById("dlg-t"), dlgB = document.getElementById("dlg-b"), dlgMore = document.getElementById("dlg-more");
  var dlgClose = null, dlgLocked = false;
  function openDlg(title, html, opts) {
    opts = opts || {};
    paused = true; keys.left = keys.right = keys.jump = false; scrollTarget = null;
    dlgT.textContent = title; dlgB.innerHTML = html;
    dlg.classList.toggle("quick", !!opts.quick);
    dlgLocked = !!opts.locked; dlgMore.hidden = dlgLocked;
    dlgClose = opts.onClose || null;
    dlgOv.hidden = false;
    dlg.style.animation = "none"; void dlg.offsetWidth; dlg.style.animation = "";
    dlg.scrollTop = 0;
    var f = dlgB.querySelector(".choice, [data-close]");
    (f || dlg).focus({ preventScroll: true });
    beep(520, 780, 0.08);
  }
  function closeDlg(force) {
    if (dlgOv.hidden || (dlgLocked && !force)) return;
    dlgOv.hidden = true; beep(400, 260, 0.06);
    var cb = dlgClose; dlgClose = null;
    if (playing) { paused = false; cv.focus({ preventScroll: true }); }
    if (cb) cb();
  }
  dlgOv.addEventListener("click", function (e) { if (e.target === dlgOv || e.target === dlgMore) closeDlg(); });

  function quickHTML() {
    return "<p>Shuvang Arjyal · IT support · Darwin, NT · Full work rights · Available now</p>" +
      '<p class="mail" id="mail-addr">' + EMAIL + "</p><p>" + T("To confirm: email") + "</p>" +
      '<div class="row"><button class="btn primary" type="button" data-copy>COPY EMAIL</button><a class="btn" href="mailto:' + EMAIL + '">OPEN MAIL</a></div>' +
      '<p style="margin-top:12px">LinkedIn ' + T("link") + " · CV " + T("file") + "</p>" +
      BLOCKS.map(function (b) { return "<h3>" + b.title + "</h3>" + b.body; }).join("") +
      "<h3>RUSH HOUR (THE REAL NIGHT)</h3><p>The tills stopped working at McDonald's in the middle of a busy service. " + T("To confirm: what you tried first, who you called, how long it took, what changed after") + "</p>" +
      '<div class="row"><button class="btn primary" type="button" data-close>' + (playing ? "BACK TO THE GAME" : "CLOSE") + "</button></div>";
  }
  function openQuick() { openDlg("QUICK VIEW", quickHTML(), { quick: true }); }
  document.getElementById("quick-btn").addEventListener("click", function () { if (!dlgOv.hidden) { dlgLocked = false; closeDlg(true); } openQuick(); });
  document.getElementById("title-quick").addEventListener("click", openQuick);
  document.addEventListener("click", function (e) {
    if (e.target.closest("[data-close]")) { closeDlg(true); return; }
    var b = e.target.closest("[data-copy]"); if (!b) return;
    function done() { b.textContent = "COPIED"; setTimeout(function () { b.textContent = "COPY EMAIL"; }, 1500); }
    function sel() { var a = document.getElementById("mail-addr"); if (!a) return; var r = document.createRange(); r.selectNodeContents(a); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    try { navigator.clipboard.writeText(EMAIL).then(done, sel); } catch (err) { sel(); }
  });

  var titleOv = document.getElementById("title");
  function start() {
    if (playing) return;
    playing = true; titleOv.hidden = true; paused = false; cv.focus({ preventScroll: true });
    beep(523, 1046, 0.2);
    floater(byte.x, byte.y - 30, "GO!");
  }
  document.getElementById("start-btn").addEventListener("click", start);

  /* ================= Boss: Rush Hour ================= */
  var round = 0, score = 0;
  function startBoss() {
    boss.state = "fight"; round = 0; score = 0; shake = reduce ? 0 : 0.6; beep(200, 90, 0.4);
    floater(boss.x, 70, "RUSH HOUR!");
    paused = true; keys.left = keys.right = false; byte.vx = 0; scrollTarget = null;
    setTimeout(bossRound, reduce ? 0 : 900);
  }
  function bossHead() { return '<div class="hud-line"><span>ROUND ' + (round + 1) + "/3</span><span>SCORE " + score + "/9</span></div>"; }
  function bossRound() {
    var r = BOSS[round];
    openDlg("BOSS: THE FROZEN TILLS", bossHead() + "<p>" + r.q + "</p><p>" + T("Demo story. Your real night will replace it.") + '</p><div class="choices">' +
      r.c.map(function (c, i) { return '<button class="choice" type="button" data-pick="' + i + '">' + c[0] + "</button>"; }).join("") + "</div>", { locked: true });
  }
  dlgB.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.pick != null) {
      var c = BOSS[round].c[+b.dataset.pick];
      score += c[1];
      if (c[1] === 0) { shake = reduce ? 0 : 1; beep(180, 70, 0.3); } else beep(660, 1100, 0.12);
      dlgB.innerHTML = bossHead() + "<p>" + BOSS[round].q + '</p><div class="verdict' + (c[1] === 0 ? " bad" : "") + '"><b>' + ["OUCH.", "NOT BAD.", "", "NICE."][c[1]] + "</b> " + c[2] +
        "</div><p><b>What I actually did:</b> " + T("To confirm") + '</p><div class="choices"><button class="choice" type="button" data-next>' + (round < 2 ? "NEXT ROUND" : "FINISH") + "</button></div>";
      dlgB.querySelector("[data-next]").focus();
    } else if (b.hasAttribute("data-next")) {
      round++;
      if (round < 3) bossRound();
      else {
        boss.state = "fixed"; gate.open = true;
        dlgB.innerHTML = '<div class="hud-line"><span>RUSH HOUR CLEARED</span><span>SCORE ' + score + "/9</span></div><p>" +
          (score === 9 ? "Textbook. That's how I'd want the shift to go." : "The restaurant made it. The gate's open, keep going.") + '</p><div class="choices"><button class="choice" type="button" data-close>CONTINUE ▶</button></div>';

    if (outfit === "student") { R(-10, y0, 6, 8, "#3d6aa8"); R(-9, y0 + 1, 4, 2, "#5b8ad0"); }
    R(-8, y0 + 2, 16, 8, P.body); R(-7, y0 + 1, 13, 1, P.body); R(-6, y0 + 7, 12, 3, P.belly);
    for (var s = -6; s < 6; s += 3) R(s, y0 + 2, 1, 1, P.bodyD);
    if (outfit === "crew") { R(-3, y0 + 4, 8, 6, P.white); R(-3, y0 + 4, 8, 1, "#d6532b"); }
    if (outfit === "office" || outfit === "support") { R(3, y0 + 2, 1, 4, "#3d6aa8"); R(2, y0 + 6, 3, 3, P.white); R(2, y0 + 6, 3, 1, "#3d6aa8"); }
    var hx = 6, hy = y0 - 4, f = b.frill;
    if (f > 0.15) {
      var r = Math.round(3 + f * 6);
      for (var a = -r; a <= r; a++) {
        var len = Math.round(Math.sqrt(r * r - a * a));
        R(hx - 2 - Math.round(len * 0.5), hy + 3 + a, len, 1, P.frill);
        if (Math.abs(a) < r - 2) R(hx - 1 - Math.round(len * 0.3), hy + 3 + a, Math.max(1, len - 4), 1, P.frillI);
      }
    } else R(hx - 3, hy + 1, 2, 6, P.frill);
    R(hx - 1, hy, 9, 7, P.body); R(hx + 7, hy + 2, 3, 4, P.body); R(hx, hy + 6, 8, 1, P.bodyD);
    if (outfit === "crew") { R(hx - 1, hy - 2, 9, 2, "#d6532b"); R(hx + 6, hy - 1, 5, 1, "#d6532b"); }
    if (outfit === "support") { R(hx, hy - 2, 7, 1, P.black); R(hx - 1, hy - 1, 1, 4, P.black); R(hx - 2, hy + 2, 2, 3, P.black); R(hx, hy + 5, 6, 1, P.black); }
    if (f > 0.7 || b.wave > 0) R(hx + 6, hy + 5, 4, 1, "#8f2f19");
    var ex = hx + 4, ey = hy + 1;
    if (b.blinkT < 0 || nap) R(ex, ey + 2, 3, 1, P.black);
    else {
      R(ex, ey, 3, 3, P.eye);
      var px = 1, py = 1;
      if (mouse.x >= 0) { var dx = (mouse.x - bx) * b.face, dy = mouse.y - (by - 18); px = dx > 6 ? 2 : dx < -6 ? 0 : 1; py = dy > 6 ? 2 : dy < -6 ? 0 : 1; }
      R(ex + px, ey + py, 1, 1, P.black);
    }
    if (outfit === "office" && !b.wave) { R(2, y0 + 3, 7, 5, "#c6c9cf"); R(3, y0 + 4, 5, 3, "#7fd3ff"); }
    if (b.wave > 0) { var wv = Math.floor(b.wave * 8) % 2; R(4, y0 - 2 - wv, 2, 5, P.bodyD); R(4 - wv, y0 - 4 - wv, 3, 2, P.bodyD); }
    ctx.restore();
    if (b.ground && b.idleT > 3 && b.idleT < 9 && Math.floor(t * 4) % 2) R(bx + b.face * 6 - 1, by - 1, 3, 1, P.bodyD);
    if (b.idleT > 5 && b.idleT < 9) { var phx = bx + b.face * 9; R(phx - 2, by - 14, 4, 6, P.black); R(phx - 1, by - 13, 2, 3, "#7fd3ff"); }

  }

    floaters.forEach(function (f) { ctx.globalAlpha = Math.max(0, 1 - f.t / 1.4); text(f.text, f.x - cam, f.y - f.t * 14, P.white, "center"); ctx.globalAlpha = 1; });

    birds.forEach(function (b) { if (prog > 0.8) return; var x = b.x - cam, up = Math.floor(b.f) % 2; R(x, b.y, 2, 1, "#4a2b3c"); R(x + 3, b.y, 2, 1, "#4a2b3c"); R(x + 2, b.y + (up ? -1 : 1), 1, 1, "#4a2b3c"); });

    if (playing && byte.x < 180 && coinCount === 0) text("HIT ? BLOCKS FROM BELOW", W / 2, 32, c, "center");
  }

  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000 || 0.016); last = now;
    update(dt);
    prog = Math.max(0, Math.min(1, (cam + W / 2) / WORLD)); sky = skyAt(prog);
    ctx.save();

    drawLayer(0.15, sky.l[0], 1, GROUND - 24, 18, 44, false);
    drawLayer(0.4, sky.l[1], 7, GROUND - 6, 14, 34, true);

    for (var fx = -((cam * 1.4) % 260); fx < W; fx += 260) { R(fx + 200, GROUND - 26, 4, 40, "#3d2438"); R(fx + 194, GROUND - 28, 16, 3, "#3d2438"); if (prog > 0.55) R(fx + 197, GROUND - 25, 10, 2, "#ffd77a"); }

  }
  requestAnimationFrame(frame);
  document.getElementById("start-btn").focus({ preventScroll: true });
})();
